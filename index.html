<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home – BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div id="nav"></div>
  <header class="hero container">
    <h1>Read and share what you're learning</h1>
    <p>A small blog for people learning to build for the web. Write a post, read others, and keep track of it all in your dashboard.</p>
    <a class="btn" href="register.html">Start writing</a>
  </header>
  
<main class="container">
  <h2 class="section-title">Latest posts</h2>

<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Search blogs by title..."
    aria-label="Search blogs by title"
  />
  <button type="button" id="clearSearch">Clear</button>
</div>


  <div class="posts" id="posts"></div>
</main>

  <div id="footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
